
<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Grid Opdracht</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <main>

                                <th>Naam</th>
                                <th>Functie</th>

                            </tr>

                            <tr>
                                <td>2</td>
                                <td>Peter</td>
                                <td>CFO</td>
                                <td><a href="#">Link</a></td>
                            </tr>

                            <tr>
                                <td>3</td>
                                <td>Mark</td>
                                <td>CTO</td>
                                <td><a href="#">Link</a></td>
                            </tr>

                            <tr>
                                <td>4</td>

                    </table>

                </div>

            </div>

        </section>

        <section class="section-dark">

            <div class="container">

                <h2>Artikel indeling</h2>

                <div class="row g-3">
                    <div class="col-md-4">

                        <div class="content-card">

                            <ul>
                                <li>Lorem</li>
                                <li>Ipsum</li>

                        </div>

                    </div>
                    <div class="col-md-8">

                        <div class="content-card">

                            <p>
                               
                            </p>

                            <p>
                                
                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        
        <section class="section-light">

            <div class="container">

                <h2>Product pagina indeling</h2>

                <div class="row g-3">

                    <div class="col-md-6">

                        <div class="image-card">

                            <img
                                src="https://placecats.com/600/500"
                                alt="Cute kitten"

                        </div>

                    </div>

                
                    <div class="col-md-6">

                        <div class="content-card">

                            <h3>Product</h3>

                            <p>

            </div>

        </section>

            <div class="container">

                <h2>Service blocks</h2>

                <div class="row g-3">

                   
                    <div class="col-md-4">

                        <div class="content-card">

                            <h3>Service</h3>

                    </div>

                    <!-- Service 2 -->
                    <div class="col-md-4">

                        <div class="content-card">

                            <h3>Service</h3>
